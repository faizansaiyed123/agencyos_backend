name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && pip install ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Import application
        run: python -c "from app.main import app; print(f'AgencyOS routes: {len(app.routes)}')"
      - name: Tests
        run: pytest
      - name: Docker build
        run: docker build --tag agencyos-backend:ci .
