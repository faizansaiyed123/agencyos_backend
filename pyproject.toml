[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agencyos-backend"
version = "0.1.0"
description = "AgencyOS: digital agency operations platform (backend)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "argon2-cffi>=23.1",
  "pyjwt>=2.8",
  "email-validator>=2.1",
  "structlog>=24.1",
  "pyotp>=2.9",
  "cryptography>=42.0",
  "qrcode>=7.4",
  "reportlab>=4.2",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "opentelemetry-api>=1.27",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-otlp-proto-http>=1.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov", "httpx", "ruff", "mypy", "import-linter", "types-qrcode"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::sqlalchemy.exc.SAWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "C4", "SIM"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
# Alembic migrations: generated import ordering/long DDL and S608 false-positives.
# Table-name f-strings are built only out of fixed constants.
"migrations/versions/*" = ["E501", "I001", "S608"]
# Raw reporting/search SQL reads best as long single statements; values are always bound.
"app/modules/reporting/service.py" = ["E501"]
"app/modules/search/service.py" = ["E501", "S608"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "core must not depend on modules"
type = "forbidden"
source_modules = ["app.core"]
forbidden_modules = ["app.modules", "app.platform"]

[[tool.importlinter.contracts]]
name = "module layering (higher may import lower, never the reverse)"
type = "layers"
layers = [
  "app.modules.portal",
  "app.modules.privacy | app.modules.search",
  "app.modules.reporting",
  "app.modules.files",
  "app.modules.collab",
  "app.modules.billing",
  "app.modules.time",
  "app.modules.proposals",
  "app.modules.projects",
  "app.modules.crm",
  "app.modules.identity",
]

[[tool.importlinter.contracts]]
name = "platform may only depend on identity (for auth), not on business modules"
type = "forbidden"
source_modules = ["app.platform"]
forbidden_modules = [
  "app.modules.crm", "app.modules.proposals", "app.modules.projects", "app.modules.time",
  "app.modules.billing", "app.modules.collab", "app.modules.files", "app.modules.privacy",
  "app.modules.reporting", "app.modules.search",
]


[tool.setuptools.packages.find]
include = ["app*"]
